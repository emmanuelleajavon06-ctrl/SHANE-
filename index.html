<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#7c3aed">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--v:#7c3aed;--o:#fb923c;--bg:#f8f7ff;--c:#fff;--t:#1b1530;--m:#6b6785;--b:#ebe8f7;--ok:#16a34a;--ko:#dc2626}
@media(prefers-color-scheme:dark){:root{--bg:#120e22;--c:#1c1733;--t:#f3f0ff;--m:#a49fc0;--b:#2d2749}}
*{box-sizing:border-box}body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--t)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.grad{background:linear-gradient(120deg,var(--v),var(--o))}
#auth{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.hero{color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:center;gap:22px;position:relative;overflow:hidden}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:#ffffff22;animation:fl 8s ease-in-out infinite}
.hero::before{width:320px;height:320px;right:-80px;top:-80px}.hero::after{width:200px;height:200px;left:-50px;bottom:-40px;animation-delay:-4s}
@keyframes fl{50%{transform:translateY(24px)}}
.hero img{width:min(380px,100%);border-radius:20px;background:#fff;padding:10px;position:relative;z-index:1}
.hero h1{font-size:34px;margin:0;line-height:1.15;position:relative;z-index:1}.hero ul{list-style:none;padding:0;margin:0;display:grid;gap:12px;position:relative;z-index:1}
.hero li{display:flex;gap:12px;align-items:center;font-weight:600}.hero li span{background:#ffffff33;border-radius:10px;padding:7px;display:grid}
.form{display:grid;place-items:center;padding:24px}.form>div{width:100%;max-width:380px;animation:up .5s}
@keyframes up{from{opacity:0;transform:translateY(16px)}}
.tabs{display:flex;background:var(--b);border-radius:12px;padding:4px;margin:18px 0}.tabs button{flex:1;border:0;background:none;padding:10px;border-radius:9px;font:inherit;font-weight:800;color:var(--m);cursor:pointer}.tabs .on{background:var(--c);color:var(--v)}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 5px}input,select{font:inherit;padding:11px;border:1px solid var(--b);border-radius:10px;width:100%;background:var(--c);color:var(--t)}input:focus,select:focus{outline:2px solid var(--v)}
.btn{border:0;border-radius:11px;padding:11px 16px;font:inherit;font-weight:800;font-size:14px;cursor:pointer;color:#fff;display:inline-flex;gap:8px;align-items:center;justify-content:center;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px #7c3aed44}.btn.p{background:linear-gradient(120deg,var(--v),var(--o))}.btn.w{background:#25d366}.btn.s{background:var(--b);color:var(--t)}.btn.r{background:var(--ko)}.btn.f{width:100%;margin-top:16px}.btn.sm{padding:6px 10px;font-size:12px}
#trial{position:sticky;top:0;z-index:20;color:#fff;padding:9px 14px;font-size:13px;font-weight:600;text-align:center}#trial button{margin-left:8px;border:0;border-radius:99px;padding:4px 12px;font:inherit;font-weight:800;color:var(--v);background:#fff;cursor:pointer}
.app{display:flex}nav{width:240px;background:var(--v);color:#fff;padding:18px 12px;position:sticky;top:36px;height:calc(100vh - 36px);display:flex;flex-direction:column;gap:4px}
.lg{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;padding:0 8px 16px}.lg i{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-style:normal;font-size:16px;background:linear-gradient(120deg,#fff,#ffd9b8);color:var(--v)}
nav a{display:flex;gap:12px;align-items:center;color:#e6dcff;text-decoration:none;padding:11px 12px;border-radius:11px;font-weight:600;font-size:14px;cursor:pointer;transition:.15s}nav a:hover{background:#ffffff22;transform:translateX(3px)}nav a.on{background:#fff;color:var(--v)}
nav .out{margin-top:auto;border:0;background:#ffffff22;color:#fff;padding:10px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
main{flex:1;min-width:0;padding:26px;max-width:1150px}#view{animation:sl .35s}@keyframes sl{from{opacity:0;transform:translateX(24px)}}
h1{margin:0 0 4px;font-size:24px}.sub{color:var(--m);margin:0 0 20px;font-size:14px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:16px}
.card{background:var(--c);border:1px solid var(--b);border-radius:16px;padding:18px;transition:.2s}.k:hover{transform:translateY(-4px);box-shadow:0 12px 28px #7c3aed1f}
.k{display:flex;gap:14px;align-items:center}.k .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:#fff}.k small{color:var(--m);font-size:13px}.k b{display:block;font-size:22px}
.tbl{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--b);white-space:nowrap}th{color:var(--m);font-size:13px}
.tag{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:800}.paye{background:#16a34a22;color:var(--ok)}.impaye{background:#dc262622;color:var(--ko)}.partiel{background:#fb923c33;color:#c2570c}
.top{display:flex;justify-content:space-between;align-items:start;gap:12px;flex-wrap:wrap}.empty{text-align:center;padding:36px;color:var(--m)}.empty svg{width:48px;height:48px;color:var(--v);opacity:.5}
canvas{width:100%;height:230px;display:block}
.pos{display:grid;grid-template-columns:1fr 340px;gap:14px}.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;align-content:start}
.prod{border:1px solid var(--b);background:var(--c);border-radius:14px;padding:14px;text-align:left;cursor:pointer;font:inherit;color:var(--t);transition:.15s}.prod:hover{border-color:var(--v);transform:translateY(-3px)}.prod b{display:block;font-size:14px}.prod span{color:var(--v);font-weight:800;font-size:13px}.prod em{display:block;font-style:normal;font-size:11px;color:var(--m)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;font-size:14px}.tot{font-size:22px;font-weight:800}
.modal{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:60;padding:16px;overflow:auto}.box{background:var(--c);border-radius:20px;padding:24px;max-width:580px;width:100%;animation:pop .25s}@keyframes pop{from{transform:scale(.93);opacity:0}}
.plans{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}.plan{border:2px solid var(--b);border-radius:16px;padding:18px;cursor:pointer;position:relative;transition:.2s}.plan.sel{border-color:var(--v);background:#7c3aed0f}.plan b{font-size:22px;display:block;margin:6px 0}.badge{position:absolute;top:-11px;right:12px;color:#fff;font-size:12px;font-weight:800;padding:3px 10px;border-radius:99px}
.pays{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.pays svg{height:34px;border-radius:9px}
#tk{font-family:monospace;font-size:12px;background:#fff;color:#000;padding:14px;border:1px dashed #999;white-space:pre;overflow-x:auto}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--t);color:var(--bg);padding:11px 18px;border-radius:12px;z-index:99;font-weight:600;display:none}
.bn{display:none}
@media(max-width:820px){#auth{grid-template-columns:1fr}.hero{padding:28px}nav{display:none}main{padding:16px 14px 90px}.pos,.plans{grid-template-columns:1fr}
.bn{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--c);border-top:1px solid var(--b);z-index:30;padding-bottom:env(safe-area-inset-bottom)}.bn a{flex:1;display:grid;justify-items:center;gap:2px;padding:9px 0;font-size:10px;font-weight:700;color:var(--m)}.bn a.on{color:var(--v)}}
@media print{body>*:not(#print){display:none!important}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

function banner(){const t=$('#trial');if(ME.subscribed){t.innerHTML=`✅ Abonnement actif jusqu'au ${new Date(ME.sub_until*1e3).toLocaleDateString('fr-FR')}`;return}
 t.innerHTML=`⏳ Essai gratuit : Il vous reste ${ME.days_left} jour${ME.days_left>1?'s':''} - Fin le ${new Date(ME.trial_end*1e3).toLocaleDateString('fr-FR')} <button onclick="paywall(1)">S'abonner</button>`}
function go2(t){location.hash=t}addEventListener('hashchange',()=>ME&&route());
async function route(){TAB=location.hash.slice(1)||'dashboard';if(!P[TAB])TAB='dashboard';document.querySelectorAll('[data-t]').forEach(a=>a.classList.toggle('on',a.dataset.t==TAB));
 const v=$('#view');v.style.animation='none';v.offsetHeight;v.style.animation='';v.innerHTML='';try{await P[TAB](v)}catch(x){}}
function count(el,to){const t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/900);el.textContent=F(to*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f)})(t0)}
function chart(c,d){const w=c.width=c.clientWidth*2,h=c.height=460,mx=Math.max(...d,1000)*1.15,x=i=>50+i*(w-100)/6,y=v=>h-60-v/mx*(h-100),g=c.getContext('2d'),t0=performance.now();
 const L=[...Array(7)].map((_,i)=>new Date(Date.now()-(6-i)*864e5).toLocaleDateString('fr-FR',{weekday:'short'}));
 (function f(t){const k=Math.min(1,(t-t0)/1100),n=k*6;g.clearRect(0,0,w,h);g.fillStyle='#8a86a0';g.font='24px sans-serif';L.forEach((s,i)=>g.fillText(s,x(i)-18,h-18));
 g.beginPath();for(let i=0;i<=Math.floor(n);i++)i?g.lineTo(x(i),y(d[i])):g.moveTo(x(i),y(d[0]));const i=Math.floor(n);if(i<6){const r=n-i;g.lineTo(x(i)+(x(i+1)-x(i))*r,y(d[i])+(y(d[i+1])-y(d[i]))*r)}
 const gr=g.createLinearGradient(0,0,w,0);gr.addColorStop(0,'#7c3aed');gr.addColorStop(1,'#fb923c');g.strokeStyle=gr;g.lineWidth=7;g.lineJoin='round';g.stroke();if(k<1)requestAnimationFrame(f)})(t0)}

const P={
async dashboard(v){const s=await api('stats');v.innerHTML=`<h1>Bonjour 👋 ${e(ME.shop)}</h1><p class="sub">Votre activité en temps réel.</p><div class="g">
${[['Revenu du jour',0,'trend','#7c3aed','rv'],['Ventes aujourd\'hui',s.sales_today,'cash','#fb923c'],['Clients',s.clients,'users','#0ea5e9'],['Dettes clients',s.debt,'alert','#dc2626','db'],['Stock faible',s.low,'box','#16a34a'],['Bénéfice 30 j.',s.month_rev-s.month_exp,'wallet','#7c3aed','bn']].map(k=>`<div class="card k"><div class="ic" style="background:${k[3]}">${ic(k[2])}</div><div><small>${k[0]}</small><b ${k[4]?`id="${k[4]}"`:''}>${k[4]?'':k[1]}</b></div></div>`).join('')}</div>
<div class="card"><b>Ventes des 7 derniers jours</b><canvas id="cv"></canvas></div>`;count($('#rv'),s.today);count($('#db'),s.debt);count($('#bn'),s.month_rev-s.month_exp);chart($('#cv'),s.days)},
async caisse(v){const [pr,cl]=await Promise.all([api('products'),api('clients')]);window.PR=pr;window.CL=cl;v.innerHTML=`<h1>Caisse</h1><p class="sub">Touchez un produit pour l'ajouter au panier.</p><div class="pos"><div class="prods">${pr.length?pr.map(p=>`<button class="prod" onclick="addC(${p.id})"><b>${e(p.name)}</b><span>${F(p.price)}</span><em>Stock : ${p.stock}</em></button>`).join(''):`<div class="card" style="grid-column:1/-1">${empty('Ajoutez d\'abord des produits.')}<p style="text-align:center"><button class="btn p" onclick="go2('produits')">Ajouter un produit</button></p></div>`}</div><div class="card" id="cart"></div></div>`;cart()},
async factures(v){const r=await api('sales');window.SL=r;v.innerHTML=`<h1>Factures</h1><p class="sub">Chaque vente génère une facture vérifiable par QR code.</p><div class="card tbl">${r.length?`<table><tr><th>N°</th><th>Date</th><th>Client</th><th>Total</th><th>Statut</th><th></th></tr>${r.map((s,i)=>{const st=s.paid>=s.total?'paye':s.paid>0?'partiel':'impaye';return`<tr><td>${s.num}</td><td>${new Date(s.created*1e3).toLocaleDateString('fr-FR')}</td><td>${e(s.client||'Comptoir')}</td><td>${F(s.total)}</td><td><span class="tag ${st}">${{paye:'Payé',partiel:'Partiel',impaye:'Impayé'}[st]}</span></td><td><button class="btn s sm" onclick="inv(${i})">Voir</button> ${st!='paye'?`<button class="btn p sm" onclick="enc(${s.id},${s.total-s.paid})">Encaisser</button>`:''}</td></tr>`}).join('')}</table>`:empty('Aucune facture. Faites votre première vente à la caisse.','file')}</div>`},
produits:crudPage('produits'),clients:crudPage('clients'),depenses:crudPage('depenses'),
async abonnement(v){v.innerHTML=`<h1>Abonnement</h1><p class="sub">${ME.subscribed?'Votre abonnement est actif.':`Essai gratuit : ${ME.days_left} jour(s) restant(s).`}</p><div class="card"><div class="pays">${PAY.Wave+PAY.OM+PAY.PD}</div><button class="btn p" onclick="paywall(1)">${ME.subscribed?'Renouveler':'Choisir une offre'}</button></div>`}};
function addC(id){const l=CART.find(x=>x.id==id),p=PR.find(x=>x.id==id);if(l){if(l.qty<p.stock)l.qty++;else toast('Stock maximum atteint')}else if(p.stock>0)CART.push({id,qty:1});else toast('Rupture de stock');cart()}
function cart(){const c=$('#cart');if(!c)return;const t=CART.reduce((a,l)=>a+l.qty*PR.find(p=>p.id==l.id).price,0);c.innerHTML=`<b>Panier</b>${CART.length?CART.map(l=>{const p=PR.find(x=>x.id==l.id);return`<div class="row"><span>${l.qty} × ${e(p.name)}</span><span>${F(l.qty*p.price)} <button class="btn s sm" onclick="rmC(${l.id})">−</button></span></div>`}).join(''):'<p class="sub">Panier vide.</p>'}
<div class="row"><span>Total</span><span class="tot">${F(t)}</span></div><label>Client (optionnel)</label><select id="cl"><option value="">Comptoir</option>${CL.map(x=>`<option value="${x.id}">${e(x.name)}</option>`).join('')}</select>
<label>Mode de paiement</label><select id="me"><option>Espèces</option><option>Wave</option><option>Orange Money</option></select><label>Montant reçu (FCFA)</label><input id="rc" type="number" min="0" placeholder="${t}" oninput="chg(${t})"><div class="row"><span>Monnaie à rendre</span><b id="ch">—</b></div>
<button class="btn p f" onclick="sell(${t})">Encaisser</button>`}
const rmC=id=>{const l=CART.find(x=>x.id==id);if(--l.qty<1)CART=CART.filter(x=>x!=l);cart()};
const chg=t=>{const r=+$('#rc').value;$('#ch').textContent=r>t?F(r-t):'—'};
async function sell(t){if(!CART.length)return toast('Panier vide');const r=+$('#rc').value||t;const o=await api('sales','POST',{items:CART,client_id:$('#cl').value,method:$('#me').value,paid:r});CART=[];const s=(await api('sales'))[0];SL=[s];inv(0)}
function inv(i){window.CUR=i;const s=SL[i],u=location.origin+'/verify/'+s.code,rest=s.total-s.paid;modal(`<div id="print"><div id="tk">${e(ME.shop)}\nFacture ${s.num}\n${new Date(s.created*1e3).toLocaleString('fr-FR')}\n------------------------------\n${s.items.map(x=>{const l=`${x.qty} x ${x.name}`.slice(0,20);return e(l)+' '.repeat(21-l.length)+Math.round(x.price*x.qty)}).join('\n')}\n------------------------------\nTOTAL   ${F(s.total)}\nPAYÉ    ${F(s.paid)}${rest>0?`\nRESTE   ${F(rest)}`:''}\n\n   Merci ! Vendre devient facile.</div><div id="qr" style="display:grid;place-items:center;margin:14px"></div></div>
<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn w" onclick="waInv(CUR)">WhatsApp</button><button class="btn s" onclick="print()">Imprimer</button><button class="btn s" onclick="closeM();route()">Fermer</button></div>`);try{new QRCode($('#qr'),{text:u,width:120,height:120})}catch(x){$('#qr').innerHTML='<small style="word-break:break-all">'+u+'</small>'}}
const waInv=i=>{const s=SL[i];wa(s.cphone,`Bonjour, voici votre facture ${s.num} de ${Math.round(s.total)}F chez ${ME.shop}. Vérifier : ${location.origin}/verify/${s.code}`)};
async function enc(id,max){const a=prompt('Montant encaissé (FCFA)',Math.round(max));if(a){await api(`sales/${id}/pay`,'POST',{amount:+a});route()}}
function paywall(vol){let plan='annuel',PI=null;const lock=!(ME&&ME.active);const MP={wave:PAY.Wave,om:PAY.OM,mixx:PAY.MX};let CM='',CN='',CK=false;const man=()=>{if(!PI||!PI.methods.length)return'';const w=PI.last&&PI.last.status=='pending',m=plan=='annuel'?'114 000':'10 000';return`<div class="card" style="margin:12px 0"><b>Payer depuis votre téléphone</b><p class="sub">Montant : <b>${m} FCFA</b>. Touchez votre moyen de paiement : le numéro du destinataire est copié, collez-le dans l'application puis envoyez.</p><div class="pays">${PI.methods.map(k=>`<span style="cursor:pointer;opacity:${!CM||CM==k?1:.45}" onclick="pick('${k}')">${MP[k]}</span>`).join('')}</div>${CK?'<p class="tag paye">✅ Numéro copié. Ouvrez l\'application, choisissez Envoyer, collez-le.</p>':''}${CN?'<p class="tag partiel">Numéro : '+e(CN)+'</p>':''}${w?'<p class="tag partiel">Paiement en attente de validation (réf. '+e(PI.last.ref)+')</p>':''}<label>Référence reçue par SMS après l\'envoi</label><input id="mref" placeholder="Ex : WV123456"><button class="btn s f" onclick="manual()">J\'ai payé</button></div>`};
 const draw=()=>modal(`<h2 style="margin-top:0">${lock?'Votre essai gratuit est terminé':'Choisissez votre offre'}</h2><p class="sub">${lock?'Abonnez-vous pour continuer à utiliser SHANE+. Vos données sont conservées.':'Tous les modules, sans engagement.'}</p>
<div class="plans"><div class="plan ${plan=='mensuel'?'sel':''}" onclick="PL('mensuel')"><span>Mensuel</span><b>10 000 FCFA</b><small class="sub">par mois</small></div><div class="plan ${plan=='annuel'?'sel':''}" onclick="PL('annuel')"><span class="badge grad">-5 %</span><span>Annuel</span><b>114 000 FCFA</b><small class="sub">Économisez 6 000 FCFA</small></div></div>
<div class="pays">${PAY.Wave+PAY.OM+PAY.PD}</div>${man()}<button class="btn p f" onclick="payNow()">Payer avec Wave, Orange Money ou carte</button>${lock?'<button class="btn s f" onclick="api(\'logout\',\'POST\').then(()=>auth());closeM()">Déconnexion</button>':''}`,lock);
 window.PL=p=>{plan=p;draw()};window.payNow=async()=>{try{const r=await api('pay/init','POST',{plan});location.href=r.url}catch(x){}};window.pick=async k=>{try{const r=await api('pay/target','POST',{m:k});CM=k;CK=false;CN='';try{await navigator.clipboard.writeText(r.number);CK=true}catch(x){CN=r.number}draw()}catch(x){}};window.manual=async()=>{try{await api('pay/manual','POST',{plan,m:CM,ref:$('#mref').value});toast('Demande envoyée. Elle sera validée après vérification.');PI=await api('pay/info');draw()}catch(x){}};draw();api('pay/info').then(x=>{PI=x;if($('#mod .modal'))draw()}).catch(()=>{})}
window.onerror=()=>{};boot();
</script></body></html>
